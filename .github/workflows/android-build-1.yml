# Place this file at .github/workflows/android-build.yml in your repo.
#
# Builds the Android app located in Source/Android. The native component
# is compiled via CMake, which the Gradle build triggers automatically —
# no separate CMake step is needed here, as long as the NDK/CMake versions
# declared in Source/Android/app/build.gradle can be auto-downloaded by
# the Android Gradle Plugin (requires SDK licenses to be accepted, which
# android-actions/setup-android handles below).

name: Android Build

on:
  push:
    branches: [ master ]
    paths:
      - 'Source/Android/**'
      - 'Source/Core/**'
  pull_request:
    paths:
      - 'Source/Android/**'
      - 'Source/Core/**'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Source/Android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        working-directory: Source/Android
        run: chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          cd Source/Android
          keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass dolphin_release -keypass dolphin_release -dname "CN=DolphinEmu,O=DolphinEmu,L=Internet,ST=Internet,C=US"

      - name: Ganti Package Name Secara Aman
        run: |
          # 1. Definisikan package lama dan baru
          OLD_PKG="org.dolphinemu.dolphinemu"
          NEW_PKG="git.kqkqku.dolphin_android.cdfree"
          
          echo "Mengganti import R dan BuildConfig ke package baru..."
          
          # 2. Hanya ganti import R dan BuildConfig di file Kotlin dan Java
          find Source/Android/app/src -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i "s/import $OLD_PKG.R/import $NEW_PKG.R/g" {} +
          find Source/Android/app/src -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i "s/import $OLD_PKG.BuildConfig/import $NEW_PKG.BuildConfig/g" {} +
          
          echo "Proses penggantian selesai dengan aman!"
          
      - name: Build debug and release APKs
        working-directory: Source/Android
        run: |
          ./gradlew assemble \
            -Pkeystore=../release.keystore \
            -Pstorepass=dolphin_release \
            -Pkeyalias=release \
            -Pkeypass=dolphin_release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: Source/Android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
